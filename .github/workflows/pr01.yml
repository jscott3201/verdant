# M01-PR01 focused CI: product execution vs docs-only vs already-validated
# selection vs empty tests vs setup failure are distinct outcomes (contract §6).
#
# - Setup failure  = toolchain install / checkout fails (its own step).
# - Docs-only      = only *.md changed under the selection policy: product
#                    steps are SKIPPED explicitly and must not claim tests ran.
# - Empty tests    = cargo test executes zero tests: hard FAIL (green badge
#                    alone is not evidence).
# - Product        = build + full test run + evidence report + smoke run.
# - Already-validated = push of a merge whose tree equals its second parent's
#                    (PR head): product steps SKIP; this run records provenance,
#                    not fresh execution. Validation is anchored to the green
#                    PR-head product run linked through the inventory below.
#                    Tree equality does not itself check that run's conclusion.
# Non-identical merge trees and direct pushes retain the full existing selection
# path and product gate (including docs-only/no-changes policy); PRs are unchanged.
# The first-commit/no-baseline path still selects product before deduplication.
# - Stops          = asserted from observed exits + `stopped` markers with
#                    explicit codes; job-level timeout-minutes is an outer
#                    failure bound, never a stop inference.
#
# Least privilege: contents:read. Checkout is pinned to the exact v4 commit
# observed in successful PR19 run 34714433781 (not a moving tag).
# No cache restore/save exists: each hosted product run builds/tests in a fresh
# checkout, clean-room with respect to project artifacts (not a hermetic OS).
# The test-log digest is supplemental; green product CI plus its tested checkout
# SHA is the anchor, not a self-referential report hash. An identical-tree merge
# reuses the green PR-head run for that tree, not the record-only merge run.

name: pr01

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pr01-checks:
    # macos-14 is arm64 (Apple Silicon), matching the D02 macOS/arm64 family.
    # The exact runner is recorded in the pins step; only the tested target
    # is claimed, all others remain untested.
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout (setup layer)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 as observed in PR19
        with:
          fetch-depth: 0

      - name: Install pinned toolchain (setup layer)
        run: |
          set -u
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
          rustc -V
          cargo -V

      - name: Classify selection (product vs docs-only)
        id: classify
        run: |
          set -u
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              base="$before"
            fi
          fi
          if [ -z "$base" ]; then
            echo "No baseline (first commit or manual run): selecting product execution."
            echo "selection=product" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ] &&
             git rev-parse --verify -q HEAD^2 >/dev/null &&
             [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^2^{tree}')" ]; then
            echo "Merge tree matches PR head: reusing its green product run, NOT executing product tests here."
            echo "selection=already-validated" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$base"...HEAD 2>/dev/null || git diff --name-only "$base" HEAD)"
          echo "Changed files vs $base:"
          echo "$files"
          if [ -z "$files" ]; then
            echo "Empty change set: skipping product execution (NOT a product pass)."
            echo "selection=no-changes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Docs-only selection policy: every changed path is Markdown.
          non_docs="$(echo "$files" | grep -vE '\.md$' || true)"
          if [ -z "$non_docs" ]; then
            echo "Docs-only selection: product tests are SKIPPED and must not be claimed as run."
            echo "selection=docs-only" >> "$GITHUB_OUTPUT"
          else
            echo "Product selection: executing build + tests."
            echo "selection=product" >> "$GITHUB_OUTPUT"
          fi

      - name: SQLite CLI flag compatibility (product execution)
        if: steps.classify.outputs.selection == 'product'
        run: |
          set -euo pipefail
          export LC_ALL=C
          # Conservative extractor, NOT a Rust parser. Freeze the reviewed command/
          # argument surface as well as scanning quoted options, including callers
          # of the extra_args wrapper. Any surface drift requires reviewing this
          # extractor; never just refresh the digest to make CI green. Inline test
          # calls are harmlessly included; dedicated *_tests.rs are not product.
          surface="$(git grep -hE 'Command::|\.args?\(|run_script(_stdin)?\(|"-{1,2}[[:alnum:]][[:alnum:]-]*"' -- src/storage ':(exclude)src/storage/sqlite/*_tests.rs')"
          digest="$(printf '%s\n' "$surface" | shasum -a 256 | awk '{print $1}')"
          if [ "$digest" != 377203c4df62680336b5b0aa426bcc97d9854ebce820d51940d44a357e1e9968 ]; then
            printf '%s\n' "$surface"
            echo '::error::SQLite argument surface changed; review flag extraction before execution.'
            exit 1
          fi
          # Only these reviewed non-CLI literals are excluded: id -u, WAL/SHM suffixes.
          flags="$(printf '%s\n' "$surface" | grep -oE '"-{1,2}[[:alnum:]][[:alnum:]-]*"' | tr -d '"' | grep -vE '^-(u|wal|shm)$' | sort -u)"
          test -n "$flags"
          printf 'Source-derived sqlite3 flags:\n%s\n' "$flags"
          # sqlite3 -help writes stderr and may exit 1 even on success. Require
          # recognizable option rows below, not that help's exit status is zero.
          help="$(sqlite3 -help 2>&1 || true)"
          options="$(printf '%s\n' "$help" | awk '$1 == "-[no]header" {print "-header"; print "-noheader"; next} $1 ~ /^-[a-z]/ {print $1}')"
          args=()
          while IFS= read -r flag; do
            # Normalize one or two leading hyphens for the help spelling only.
            case "$flag" in --*) option="-${flag#--}" ;; *) option="$flag" ;; esac
            if ! printf '%s\n' "$options" | grep -Fx -- "$option"; then
              echo "::error::CI sqlite3 lacks product flag $flag"
              exit 1
            fi
            case "$flag" in
              --version) sqlite3 "$flag" ;;
              -separator) args+=("$flag" '|') ;;
              *) args+=("$flag") ;;
            esac
          done <<< "$flags"
          # Also exercise exact argv spellings, without creating a database file.
          test "$(sqlite3 "${args[@]}" :memory: 'SELECT 1;')" = 1

      - name: Build — one supported target first (product execution)
        if: steps.classify.outputs.selection == 'product'
        run: |
          set -u
          cargo build --locked
          echo "--- exact pins ---"
          rustc -V
          cargo -V
          rustc -vV | grep host || true

      - name: SQLite linkage and Selene lockfile evidence (product execution)
        if: steps.classify.outputs.selection == 'product'
        run: |
          set -euo pipefail
          linkage="$(otool -L ./target/debug/verdant)"
          printf '%s\n' "$linkage"
          if printf '%s\n' "$linkage" | grep -iq sqlite; then
            echo '::error::unexpected SQLite dynamic linkage'
            exit 1
          fi
          echo 'No SQLite dynamic library in this binary; this is not a static-link audit.'
          echo '--- Selene package version and exact source revision from Cargo.lock ---'
          awk '/^\[\[package\]\]/ {selene=0} /^name = "selene-db"$/ {selene=1; found=1} selene && /^(name|version|source) =/ {print} END {if (!found) exit 1}' Cargo.lock

      - name: Test — full run, empty execution fails (product execution)
        if: steps.classify.outputs.selection == 'product'
        run: |
          set -u -o pipefail
          cargo test --locked 2>&1 | tee pr01-test.log
          passed="$(grep -oE '[0-9]+ passed' pr01-test.log | awk '{s+=$1} END {print s+0}')"
          echo "Executed passing tests (summed over suites): $passed"
          if [ "$passed" -le 0 ]; then
            echo "::error::empty tests: 0 tests executed — an empty run does NOT pass."
            exit 3
          fi
          echo '--- SHA-256 of the captured full test log (supplemental CI evidence) ---'
          shasum -a 256 pr01-test.log

      - name: Evidence report (product execution)
        if: steps.classify.outputs.selection == 'product'
        run: |
          set -u
          cargo run --locked -- evidence
          echo "--- explicit evidence-completeness re-run (manifest visible) ---"
          cargo test --locked evidence_completeness -- --nocapture

      - name: Smoke — start/stop + refusals with explicit codes (product execution)
        if: steps.classify.outputs.selection == 'product'
        run: |
          set -u
          work="$(mktemp -d "${TMPDIR:-/tmp}/verdant-pr01-ci-XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/durable"
          bin="./target/debug/verdant"
          printf 'role = "standalone"\ndurable_path = "%s/durable"\n' "$work" > "$work/ok.conf"
          "$bin" health --config "$work/ok.conf" | tee "$work/health.log"
          grep -q 'listener: none' "$work/health.log"
          "$bin" run --config "$work/ok.conf" --once | tee "$work/run.log"
          grep -q 'verdant starting role=standalone' "$work/run.log"
          grep -q 'verdant stopped reason=once' "$work/run.log"
          printf 'role = "nope"\ndurable_path = "%s/durable"\n' "$work" > "$work/bad.conf"
          if "$bin" run --config "$work/bad.conf" --once 2>"$work/bad.log"; then
            echo "::error::invalid role unexpectedly started"
            exit 1
          fi
          grep -q '\[unknown-role\]' "$work/bad.log"
          echo "smoke: explicit starts, stops and refusals all asserted by exit code + markers"

      - name: Pins and environment inventory (report only)
        if: always()
        run: |
          echo "--- compiler/toolchain ---"
          rustc -V || true
          cargo -V || true
          echo "--- host ---"
          uname -a || true
          sw_vers || true
          sysctl -n machdep.cpu.brand_string || true
          sysctl -n hw.ncpu || true
          sysctl -n hw.memsize || true
          df -h . || true
          echo "--- sqlite (system CLI; linkage checked separately on product runs) ---"
          sqlite3 --version || true
          echo "--- selection ---"
          echo "selection=${{ steps.classify.outputs.selection }}"
          echo "--- tested source/tree (CI manifest; distinct from any later report commit) ---"
          git rev-parse HEAD || echo "no commit (uncommitted worktree)"
          git status --short --branch || true
          if [ "${{ steps.classify.outputs.selection }}" = "already-validated" ]; then
            echo "--- identical-tree merge record (NOT fresh product execution) ---"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            pr_head="$(git rev-parse HEAD^2)"
            echo "validating-pr-head=$pr_head"
            echo "PR-head source: ${{ github.server_url }}/${{ github.repository }}/commit/$pr_head"
            echo "PR-head checks/run links: ${{ github.server_url }}/${{ github.repository }}/commit/$pr_head/checks"
            echo "Green pr01 PR-head run lookup: ${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/pr01.yml/runs?event=pull_request&head_sha=$pr_head&status=success"
            echo "The green PR-head product run and its tested checkout SHA anchor validation; this merge run only records the identical tree."
          fi
