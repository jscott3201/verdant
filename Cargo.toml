[package]
name = "verdant"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
description = "Verdant local-first site telemetry — M01-PR01 runnable workspace and profile boundaries"
publish = false

# Single-crate workspace (owner-selected for M01-PR01). PR02–PR06 add
# scoped modules under src/ via the integration owner; no empty crates.
[workspace]

[[bin]]
name = "verdant"
path = "src/main.rs"

# M01-PR05 native lifecycle (D02 amendment, owner-visible): this slice ENDS
# the zero-dep era, minimally. Exactly one external dependency: the SeleneDB
# `development` embedding facade at the pinned commit below (D05 record:
# track `development` with exact-commit-per-validation discipline — this rev
# is qualified ONLY for this validation; any bump needs re-qualification).
# Mechanism is a git dependency at the EXACT pinned rev so public clones
# reproduce it; never a path dependency (unreproducible), never vendored
# sources. Default features only (no test-harness, no metrics, no wgpu/GPU,
# no benchmark/opt-in surface): the facade lifecycle alone
# (Database::create/open/checkpoint/prune + session execute).
[dependencies]
selene-db = { git = "https://github.com/jscott3201/selene-db.git", rev = "b65c2344c916d2c3ceeb72cefcd72e7960e95e25" }

# M02-PR01B closed E01: exactly these five additional direct dependencies.
# rusty-bacnet 02dd371201cb5d203058e9d0c8076c9ec9127338, default features;
# ipv6/sc-tls remain OFF. Public read codecs/client plus socket-free TransportPort
# fixtures only; no live transport construction. Tokio is adapter-confined.
# Zero APDU retries are configured, but zero-retry wire semantics are UNVERIFIED.
bacnet-client = { git = "https://github.com/jscott3201/rusty-bacnet", rev = "02dd371201cb5d203058e9d0c8076c9ec9127338" }
bacnet-types = { git = "https://github.com/jscott3201/rusty-bacnet", rev = "02dd371201cb5d203058e9d0c8076c9ec9127338" }
bacnet-services = { git = "https://github.com/jscott3201/rusty-bacnet", rev = "02dd371201cb5d203058e9d0c8076c9ec9127338" }
bacnet-transport = { git = "https://github.com/jscott3201/rusty-bacnet", rev = "02dd371201cb5d203058e9d0c8076c9ec9127338" }
tokio = { version = "1", features = ["net", "rt", "sync", "macros", "time", "io-util"] }

# M02-PR04 D02/E01 amendment (2026-09-14): exactly these five 0.1.1
# packages at 70c8e50ab08ad039513a437f0fa328bf5974b57c, default features.
# Read-only public client/codec/TCP profile; tls/server/gateway/pool/rtu/
# rtu-serial/full/cli/sim/conformance/python are not selected. Upstream floor
# 1.95 is below our unchanged 1.97.1 pin. Tokio io-util adds only the bounded
# test peer's TCP byte I/O; Tokio remains adapter-confined. Zero retries are
# configured, NOT a qualified wire-single-packet guarantee.
rusty-modbus-client = { git = "https://github.com/jscott3201/rusty-modbus", rev = "70c8e50ab08ad039513a437f0fa328bf5974b57c" }
rusty-modbus-types = { git = "https://github.com/jscott3201/rusty-modbus", rev = "70c8e50ab08ad039513a437f0fa328bf5974b57c" }
rusty-modbus-codec = { git = "https://github.com/jscott3201/rusty-modbus", rev = "70c8e50ab08ad039513a437f0fa328bf5974b57c" }
rusty-modbus-frame = { git = "https://github.com/jscott3201/rusty-modbus", rev = "70c8e50ab08ad039513a437f0fa328bf5974b57c" }
rusty-modbus-tcp = { git = "https://github.com/jscott3201/rusty-modbus", rev = "70c8e50ab08ad039513a437f0fa328bf5974b57c" }
